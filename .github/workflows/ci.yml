# En cada push y Pull Request: pruebas de la API contra un PostgreSQL real.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (Jest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huellitas
          POSTGRES_PASSWORD: huellitas_dev
          POSTGRES_DB: huellitas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huellitas -d huellitas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://huellitas:huellitas_dev@localhost:5432/huellitas_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate
      - run: npm test
      # Corre en un contenedor para que pg_dump sea de la misma versión que el servidor:
      # el del runner es más nuevo y su copia no se restaura en PostgreSQL 16.
      - name: Probar la copia de seguridad y su restauración
        run: >-
          docker run --rm --network host -v "$PWD:/app" -w /app -e BD_URL="$DATABASE_URL_TEST"
          postgres:16-alpine sh -c 'apk add -q bash gnupg && scripts/probar-copia.sh'
